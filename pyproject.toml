[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpip"
version = "0.1.0"
description = "Transfer Pricing Intelligence Platform"
authors = [{name = "Daru", email = "danirubio2323@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "streamlit>=1.28.1",
    "anthropic>=0.39.0",
    "pandas>=2.1.3",
    "numpy>=1.26.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
]

[tool.setuptools]
packages = ["tp_domain", "api", "ui", "ai", "tests", "infrastructure"]
