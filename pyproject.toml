[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpip"
version = "0.1.0"
description = "Transfer Pricing Intelligence Platform"
authors = [{name = "Daru", email = "danirubio2323@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
    "streamlit>=1.36",
    "numpy>=1.26",
    "reportlab>=4.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pypdf>=5.0",
]

[tool.setuptools]
packages = [
    "tp_domain",
    "tp_domain.calculations",
    "tp_domain.rules",
    "api",
    "ui",
    "ai",
    "infrastructure",
    "infrastructure.report",
]
