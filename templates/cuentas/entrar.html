<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — TPIP</title>
</head>
<body>
  <main>
    <h1>TPIP</h1>
    <p>Análisis de precios de transferencia</p>

    {% if error %}<p role="alert">{{ error }}</p>{% endif %}

    <form method="post" action="{% url 'cuentas:entrar' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <label for="id_username">Usuario</label>
      <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>

      <label for="id_password">Contraseña</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
